{{define "tenant/list.html"}}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenants — CRM Juridico</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="/static/css/components-pro.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <script src="/static/js/ui.js" defer></script>
</head>
<body>
<div class="admin-layout">
    {{template "partials/sidebar.html" (dict "ActiveNav" "tenants")}}
    <main class="admin-content">
        <div class="page-header">
            <div>
                <h1>Tenants</h1>
            </div>
            <a href="/admin/tenants/new" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                Novo Tenant
            </a>
        </div>
        <div class="admin-table-wrapper">
            <div class="filters-bar">
                <input type="search" name="search" placeholder="Buscar por nome ou documento..."
                       value="{{.Search}}"
                       hx-get="/admin/tenants"
                       hx-trigger="input changed delay:300ms, search"
                       hx-target="#tenants-table"
                       hx-include="[name='status'],[name='type']">
                <select name="status"
                        hx-get="/admin/tenants"
                        hx-trigger="change"
                        hx-target="#tenants-table"
                        hx-include="[name='search'],[name='type']">
                    <option value="" {{if not .Status}}selected{{end}}>Todos os status</option>
                    <option value="active" {{if eq .Status "active"}}selected{{end}}>Ativo</option>
                    <option value="blocked" {{if eq .Status "blocked"}}selected{{end}}>Bloqueado</option>
                    <option value="inactive" {{if eq .Status "inactive"}}selected{{end}}>Inativo</option>
                </select>
                <select name="type"
                        hx-get="/admin/tenants"
                        hx-trigger="change"
                        hx-target="#tenants-table"
                        hx-include="[name='search'],[name='status']">
                    <option value="" {{if not .Type}}selected{{end}}>Todos os tipos</option>
                    <option value="PF" {{if eq .Type "PF"}}selected{{end}}>PF</option>
                    <option value="PJ" {{if eq .Type "PJ"}}selected{{end}}>PJ</option>
                </select>
            </div>
            <div id="tenants-table">
                {{template "tenant/table.html" .}}
            </div>
        </div>
    </main>
</div>
<script src="/static/js/admin.js"></script>
</body>
</html>
{{end}}
