{{define "funnel/kanban.html"}}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads — CRM Juridico</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/whatsapp.css">
    <link rel="stylesheet" href="/static/css/kanban.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
<div class="admin-layout">
    {{template "partials/tenant_sidebar.html" (dict "ActiveNav" "leads")}}
    <main class="admin-content kanban-main">
        <div class="kanban-header">
            <div class="kanban-header-left">
                {{if .Funnels}}
                <select class="kanban-funnel-select"
                        hx-get="/tenant/leads/kanban"
                        hx-target="#kanban-content"
                        hx-include="[name=product_id],[name=search]"
                        name="funnel_id">
                    {{range .Funnels}}
                    <option value="{{.ID}}" {{if eq .ID $.CurrentFunnelID}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
                {{end}}
                {{if .Products}}
                <select class="kanban-funnel-select"
                        hx-get="/tenant/leads/kanban"
                        hx-target="#kanban-content"
                        hx-include="[name=funnel_id],[name=search]"
                        name="product_id"
                        style="min-width:160px">
                    <option value="">Todos os produtos</option>
                    {{range .Products}}
                    <option value="{{.ID}}" {{if eq .ID $.CurrentProductID}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
                {{end}}
                <input type="search" class="kanban-search" placeholder="Buscar lead..."
                       hx-get="/tenant/leads/kanban"
                       hx-trigger="input changed delay:300ms"
                       hx-target="#kanban-content"
                       hx-include="[name=funnel_id],[name=product_id]"
                       name="search">
            </div>
            <div class="kanban-header-right">
                <a href="/tenant/leads/funnels" class="btn btn-sm btn-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Configurar
                </a>
            </div>
        </div>
        <div id="kanban-content"
             hx-get="/tenant/leads/kanban{{if .CurrentFunnelID}}?funnel_id={{.CurrentFunnelID}}{{end}}"
             hx-trigger="load, refresh"
             hx-target="#kanban-content">
            <div class="kanban-loading">
                <div class="spinner"></div>
                <p>Carregando kanban...</p>
            </div>
        </div>
    </main>
</div>
<div id="lead-modal"></div>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="/static/js/kanban.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
{{end}}
