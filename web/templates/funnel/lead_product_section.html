{{define "funnel/lead_product_section.html"}}
<h4>Produto</h4>
{{if .ProductName}}
<div style="display:flex;justify-content:space-between;align-items:center">
    <span style="background:#dbeafe;color:#2563eb;padding:2px 10px;border-radius:12px;font-size:0.8125rem">{{.ProductName}}</span>
    <button class="btn btn-sm btn-outline"
            hx-get="/tenant/leads/{{.LeadID}}/product-form"
            hx-target="#lead-product-section"
            hx-swap="innerHTML">Alterar</button>
</div>
{{else}}
<div style="display:flex;justify-content:space-between;align-items:center">
    <p class="lead-empty-text" style="margin:0">Nenhum produto associado</p>
    <button class="btn btn-sm btn-outline"
            hx-get="/tenant/leads/{{.LeadID}}/product-form"
            hx-target="#lead-product-section"
            hx-swap="innerHTML">Associar</button>
</div>
{{end}}
{{end}}
