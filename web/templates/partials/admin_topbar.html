{{define "partials/admin_topbar.html"}}
<header class="admin-topbar">
    <div class="admin-topbar-left">
        <nav class="admin-breadcrumb" aria-label="Breadcrumb">
            <a href="/admin/dashboard">Admin</a>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            <span class="current">{{if .PageTitle}}{{.PageTitle}}{{else}}Dashboard{{end}}</span>
        </nav>
    </div>
    <div class="admin-topbar-right">
        <div class="admin-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" placeholder="Buscar..." aria-label="Buscar">
        </div>
        <a href="/admin/logs" class="admin-icon-btn" aria-label="Logs" title="Logs de auditoria">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
        </a>
        <a href="https://docs/" class="admin-icon-btn" aria-label="Documentação" title="Documentação" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        </a>
    </div>
</header>
{{end}}
