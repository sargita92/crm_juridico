{{define "partials/tenant_sidebar.html"}}
<button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Menu">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
</button>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
<aside class="admin-sidebar tenant-sidebar" id="admin-sidebar" aria-label="Navegação do tenant">
    <div class="sidebar-logo">
        <div>
            <h1>CRM Jurídico</h1>
            <small data-office-name title="Escritório">Carregando…</small>
        </div>
    </div>
    <nav class="sidebar-nav" aria-label="Navegação principal">
        <span class="sidebar-nav-section">Visão geral</span>
        <a href="/dashboard" class="{{if .ActiveNav}}{{if eq .ActiveNav "dashboard"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/></svg>
            Dashboard
        </a>

        <span class="sidebar-nav-section">Atendimento</span>
        <a href="/tenant/whatsapp" class="{{if .ActiveNav}}{{if eq .ActiveNav "whatsapp"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
            WhatsApp
        </a>
        <a href="/tenant/leads" class="{{if .ActiveNav}}{{if eq .ActiveNav "leads"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/></svg>
            Leads
        </a>

        <span class="sidebar-nav-section">Operação</span>
        <a href="/tenant/team" class="{{if .ActiveNav}}{{if eq .ActiveNav "team"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-5.13a4 4 0 11-8 0 4 4 0 018 0zm6 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            Equipe
        </a>
        <a href="/tenant/products" class="{{if .ActiveNav}}{{if eq .ActiveNav "products"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
            Produtos
        </a>
        <a href="/tenant/automations" class="{{if .ActiveNav}}{{if eq .ActiveNav "automations"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            Automações
        </a>
        <a href="/tenant/files" class="{{if .ActiveNav}}{{if eq .ActiveNav "files"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v13a1 1 0 001 1h16a1 1 0 001-1V9a1 1 0 00-1-1h-8l-2-3H4a1 1 0 00-1 1z"/></svg>
            Arquivos
        </a>

        <span class="sidebar-nav-section">Conta</span>
        <a id="sidebar-link-pagamentos" href="/tenant/payment" class="{{if .ActiveNav}}{{if eq .ActiveNav "pagamentos"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2 8.5h20m-18 8.5h16a2 2 0 002-2V6a2 2 0 00-2-2H4a2 2 0 00-2 2v9a2 2 0 002 2z"/></svg>
            Pagamentos
        </a>
        {{if aiPlaygroundEnabled}}
        <a href="/tenant/ai/playground" class="{{if .ActiveNav}}{{if eq .ActiveNav "ai_playground"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21c-2.773 0-5.491-.235-8.135-.687-1.718-.293-2.3-2.379-1.067-3.61L5 14.5"/></svg>
            AI Playground
        </a>
        {{end}}
    </nav>
    <div class="sidebar-footer">
        <div id="whatsapp-status-indicator"
             class="tenant-wa-status"
             hx-get="/tenant/whatsapp/status"
             hx-trigger="load, every 10s"
             hx-target="#whatsapp-status-indicator">
        </div>
        <form hx-post="/logout" style="margin:0">
            <button type="submit" class="sidebar-logout-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sair
            </button>
        </form>
    </div>
</aside>
<script>
// UX-only: esconde "Pagamentos" se cookie ux_show_pagamentos=0 (autorização real fica no
// PortalAccessChecker). Também popula o nome do escritório a partir do cookie crm_office_name
// (definido pelo middleware OfficeName, gin URL-encoda o value, então decodificamos com
// decodeURIComponent + replace de "+" por espaço).
(function () {
    function readCookie(name) {
        var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]+)'));
        return m ? m[1] : '';
    }
    var pag = readCookie('ux_show_pagamentos');
    if (pag === '0') {
        var el = document.getElementById('sidebar-link-pagamentos');
        if (el) el.style.display = 'none';
    }
    var raw = readCookie('crm_office_name');
    if (raw) {
        try {
            var name = decodeURIComponent(raw.replace(/\+/g, '%20'));
            document.querySelectorAll('[data-office-name]').forEach(function (n) { n.textContent = name; });
        } catch (e) { /* ignore malformed */ }
    } else {
        document.querySelectorAll('[data-office-name]').forEach(function (n) { n.textContent = 'Área do Tenant'; });
    }
})();
</script>
{{end}}
