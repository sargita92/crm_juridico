{{define "partials/sidebar.html"}}
<button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Menu">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
</button>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
<aside class="admin-sidebar" id="admin-sidebar">
    <div class="sidebar-logo">
        <div>
            <h1>CRM Juridico</h1>
            <small>Painel Admin</small>
        </div>
    </div>
    <nav class="sidebar-nav" aria-label="Navegação principal">
        <span class="sidebar-nav-section">Visão geral</span>
        <a href="/admin/dashboard" class="{{if .ActiveNav}}{{if eq .ActiveNav "dashboard"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/></svg>
            Dashboard
        </a>

        <span class="sidebar-nav-section">Gestão</span>
        <a href="/admin/tenants" class="{{if .ActiveNav}}{{if eq .ActiveNav "tenants"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
            Escritórios
        </a>
        <a href="/admin/specialists" class="{{if .ActiveNav}}{{if eq .ActiveNav "specialists"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.3 24.3 0 014.5 0m0 0v5.714a2.25 2.25 0 00.659 1.591L19 14.5M14.25 3.104c.251.023.501.05.75.082M19 14.5l-2.47 2.47a3.375 3.375 0 01-4.06.644L12 17.5l-.47.114a3.375 3.375 0 01-4.06-.644L5 14.5m14 0V17a2 2 0 01-2 2H7a2 2 0 01-2-2v-2.5"/></svg>
            Especialistas
        </a>
        <a href="/admin/guardrails" class="{{if .ActiveNav}}{{if eq .ActiveNav "guardrails"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z"/></svg>
            Guardrails
        </a>
        <a href="/admin/documents" class="{{if .ActiveNav}}{{if eq .ActiveNav "documents"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
            Documentos
        </a>

        <span class="sidebar-nav-section">Plataforma</span>
        <a href="/admin/mcps" class="{{if .ActiveNav}}{{if eq .ActiveNav "mcps"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m9.86-2.03a4.5 4.5 0 00-6.364-6.364L4.5 8.257"/></svg>
            MCPs
        </a>
        <a href="/admin/products" class="{{if .ActiveNav}}{{if eq .ActiveNav "products"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
            Produtos
        </a>
        <a href="/admin/payment" class="{{if .ActiveNav}}{{if eq .ActiveNav "pagamentos"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2 8.5h20m-18 8.5h16a2 2 0 002-2V6a2 2 0 00-2-2H4a2 2 0 00-2 2v9a2 2 0 002 2z"/></svg>
            Pagamentos
        </a>

        <span class="sidebar-nav-section">Auditoria</span>
        <a href="/admin/logs" class="{{if .ActiveNav}}{{if eq .ActiveNav "logs"}}active{{end}}{{end}}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Logs
        </a>
    </nav>
    <div class="sidebar-footer">
        <div class="sidebar-user">
            <span class="sidebar-avatar">A</span>
            <div class="sidebar-user-info">
                <span class="sidebar-user-name">Administrador</span>
                <span class="sidebar-user-role">Super admin</span>
            </div>
        </div>
        <a href="/select-tenant" class="sidebar-switch-btn" title="Entrar em escritório">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
            Entrar em escritório
        </a>
        <form hx-post="/logout" style="margin:0">
            <button type="submit" class="sidebar-logout-btn" aria-label="Sair">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="vertical-align:middle"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Sair
            </button>
        </form>
    </div>
</aside>
{{end}}
