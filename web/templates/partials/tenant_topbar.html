{{define "partials/tenant_topbar.html"}}
<header class="admin-topbar tenant-topbar">
    <div class="admin-topbar-left">
        <nav class="admin-breadcrumb" aria-label="Breadcrumb">
            <a href="/dashboard"><span data-office-name>Escritório</span></a>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            <span class="current">{{if .PageTitle}}{{.PageTitle}}{{else}}Painel{{end}}</span>
        </nav>
    </div>
    <div class="admin-topbar-right">
        <div class="admin-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" placeholder="Buscar conversas, leads, arquivos…" aria-label="Buscar">
        </div>
        <a href="/tenant/whatsapp" class="admin-icon-btn" aria-label="Conversas WhatsApp" title="Conversas WhatsApp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </a>
        <a href="/tenant/leads" class="admin-icon-btn" aria-label="Leads" title="Leads">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
        </a>
    </div>
</header>
{{end}}
