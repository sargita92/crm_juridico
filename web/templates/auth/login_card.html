{{define "auth/login_card.html"}}
<div class="auth-card-pro" id="login-card">
    <div class="auth-card-head">
        <span class="auth-card-eyebrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            Acesso ao painel
        </span>
        <h2>Entrar na sua conta</h2>
        <p class="auth-card-sub">Use seu e-mail corporativo e senha para acessar o CRM.</p>
    </div>

    <form hx-post="/login"
          hx-target="#login-card"
          hx-swap="outerHTML"
          hx-disabled-elt="button[type='submit']"
          class="form-stagger"
          novalidate>

        {{if .Error}}
        <div class="form-error" role="alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
            <span>{{.Error}}</span>
        </div>
        {{end}}

        <div class="form-group">
            <label for="email">E-mail</label>
            <div class="auth-input-wrap">
                <input type="email" id="email" name="email"
                       placeholder="seu@email.com"
                       required autofocus autocomplete="email">
                <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            </div>
        </div>

        <div class="form-group">
            <label for="password">
                <span>Senha</span>
                <a href="#" class="auth-forgot" tabindex="-1">Esqueci a senha</a>
            </label>
            <div class="password-wrapper auth-input-wrap">
                <input type="password" id="password" name="password"
                       placeholder="Sua senha" required
                       autocomplete="current-password">
                <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Mostrar/ocultar senha">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                    <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-primary">
            <span class="spinner"></span>
            <span class="btn-text">Entrar</span>
            <span class="btn-loading-text">Entrando...</span>
        </button>
    </form>

    <p class="auth-card-foot">
        Ainda não tem conta?
        <a href="/#contato">Fale com a equipe</a>
    </p>
</div>
{{end}}
