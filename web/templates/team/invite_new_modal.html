{{define "team/invite_new_modal.html"}}
<form hx-post="/tenant/team/invites" hx-target="#team-modal-body" hx-swap="innerHTML">
    <div class="form-group">
        <label>Grupos de permissão</label>
        <div style="display: flex; flex-direction: column; gap: 0.75rem; padding: 0.75rem 0;">
            {{range .Groups}}
            <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; font-weight: 400; text-transform: none; letter-spacing: normal; color: #333; margin-bottom: 0;">
                <input type="checkbox" name="group_ids" value="{{.ID}}" style="width: auto; padding: 0; border: none; background: none;">
                {{.Name}}
            </label>
            {{else}}
            <p class="muted" style="margin: 0;">Nenhum grupo cadastrado — o convite criará um usuário sem grupos.</p>
            {{end}}
        </div>
    </div>
    <div class="form-group">
        <label>Expira em (dias)</label>
        <input type="number" name="expires_in_days" min="1" max="90" value="7" required style="width: 100%; padding: 0.7rem 1rem; font-size: 0.9rem; border: 1.5px solid #e2e8f0; border-radius: 8px; background: #f8fafc; color: #1a202c;">
    </div>
    <div class="modal-actions">
        <button type="button" class="btn" onclick="closeModal('team-modal')" style="padding: 0.6rem 1.25rem; font-size: 0.9rem; border: 1.5px solid #e2e8f0; background: #fff; color: #4a5568; border-radius: 8px; cursor: pointer; transition: all 0.2s;">Cancelar</button>
        <button type="submit" class="btn btn-primary" style="padding: 0.6rem 1.25rem; font-size: 0.9rem; width: auto;">Gerar convite</button>
    </div>
</form>
{{end}}
