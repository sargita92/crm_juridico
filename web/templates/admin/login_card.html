{{define "admin/login_card.html"}}
<div class="auth-card" id="login-card">
    <div class="auth-logo">
        <h1>CRM Juridico</h1>
        <small style="color:#718096;font-size:0.8rem;display:block;margin-top:0.25rem">Painel Administrativo</small>
    </div>
    <form hx-post="/admin/login" hx-target="#login-card" hx-swap="outerHTML" hx-disabled-elt="button[type='submit']">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="admin@email.com" required autofocus autocomplete="email">
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="Sua senha" required autocomplete="current-password">
                <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Mostrar/ocultar senha">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                    <svg id="eye-off-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                    </svg>
                </button>
            </div>
        </div>
        {{if .Error}}
        <div class="form-error">{{.Error}}</div>
        {{end}}
        <button type="submit" class="btn-primary">
            <span class="spinner"></span>
            <span class="btn-text">Entrar</span>
            <span class="btn-loading-text">Entrando...</span>
        </button>
    </form>
</div>
{{end}}
