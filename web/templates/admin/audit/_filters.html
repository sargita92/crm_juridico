{{define "admin/audit/_filters.html"}}
<form class="filters filters-pro" method="get" action="/admin/logs"
      hx-get="/admin/logs" hx-target="#logs-list" hx-push-url="true" hx-include="closest form">
    <div class="filters-grid">
        <label class="field">
            <span>Tenant</span>
            <select name="tenant_id">
                <option value="">Todos</option>
                {{range .TenantOptions}}
                    <option value="{{.ID}}" {{if eq $.Filters.TenantID .ID}}selected{{end}}>{{.Name}}</option>
                {{end}}
            </select>
        </label>

        <label class="field">
            <span>Usuário admin</span>
            <select name="user_id">
                <option value="">Todos</option>
                {{range .UserOptions}}
                    <option value="{{.ID}}" {{if eq $.Filters.UserID .ID}}selected{{end}}>{{.Name}} ({{.Email}})</option>
                {{end}}
            </select>
        </label>

        <label class="field">
            <span>Ação</span>
            <select name="action">
                <option value="">Todas</option>
                {{range .Actions}}
                    <option value="{{.Code}}" {{if eq $.Filters.Action .Code}}selected{{end}}>{{.Label}}</option>
                {{end}}
            </select>
        </label>

        <label class="field field-sm">
            <span>De</span>
            <input type="date" name="from" value="{{.Filters.From}}">
        </label>
        <label class="field field-sm">
            <span>Até</span>
            <input type="date" name="to" value="{{.Filters.To}}">
        </label>
        <label class="field field-xs">
            <span>Por página</span>
            <select name="page_size">
                {{range .PageSizes}}
                    <option value="{{.}}" {{if eq (printf "%d" .) $.Filters.PageSize}}selected{{end}}>{{.}}</option>
                {{end}}
            </select>
        </label>
    </div>

    <div class="filters-actions">
        <a href="/admin/logs" class="btn">Limpar</a>
        <button type="submit" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            Aplicar
        </button>
    </div>
</form>
{{end}}
