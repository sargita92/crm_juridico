{{define "mcp/list.html"}}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCPs — CRM Juridico</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="/static/css/components-pro.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <script src="/static/js/ui.js" defer></script>
</head>
<body>
<div class="admin-layout">
    {{template "partials/sidebar.html" (dict "ActiveNav" "mcps")}}
    <main class="admin-content">
        <div class="page-header">
            <div><h1>MCPs</h1></div>
            <a href="/admin/mcps/new" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                Novo MCP
            </a>
        </div>
        <div class="admin-table-wrapper">
            <div class="filters-bar">
                <input type="search" name="search" placeholder="Buscar por nome..."
                       value="{{.Search}}"
                       hx-get="/admin/mcps"
                       hx-trigger="input changed delay:300ms, search"
                       hx-target="#mcps-table">
            </div>
            <div id="mcps-table">
                {{template "mcp/table.html" .}}
            </div>
        </div>
    </main>
</div>
<script src="/static/js/admin.js"></script>
</body>
</html>
{{end}}
