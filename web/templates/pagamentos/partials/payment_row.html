{{define "pagamentos/partials/payment_row.html"}}
<tr id="payment-{{.Row.ID}}">
    <td>{{.Row.Tipo}}</td>
    <td>{{if .Row.Descricao}}{{.Row.Descricao}}{{else}}{{.Row.Competencia}}{{end}}</td>
    <td>{{.Row.Valor}}</td>
    <td>{{.Row.DataVencimento}}</td>
    <td><span class="{{.Row.StatusBadge}}">{{.Row.Status}}</span></td>
    <td class="row-actions">
        {{if .Row.PodeMarcarPago}}
        <button class="btn btn-success"
                hx-post="/admin/pagamentos/{{.Row.ID}}/pagar"
                hx-target="#payment-{{.Row.ID}}"
                hx-swap="outerHTML">Marcar pago</button>
        {{end}}
        {{if .Row.PodeCancelar}}
        <form hx-post="/admin/pagamentos/{{.Row.ID}}/cancelar"
              hx-target="#payment-{{.Row.ID}}"
              hx-swap="outerHTML"
              style="display:inline">
            <input type="text" name="motivo" placeholder="Motivo" required>
            <button class="btn btn-danger" type="submit">Cancelar</button>
        </form>
        {{end}}
    </td>
</tr>
{{end}}
