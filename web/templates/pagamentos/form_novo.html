{{define "pagamentos/form_novo.html"}}
<div class="modal-content">
    <h2>Novo lançamento avulso</h2>
    {{if .Error}}<p class="alert alert-danger">{{.Error}}</p>{{end}}
    <form hx-post="/admin/tenants/{{.TenantID}}/payment"
          hx-target="#modal"
          hx-swap="innerHTML">
        <div class="form-group">
            <label for="descricao">Descrição</label>
            <input id="descricao" name="descricao" required maxlength="255">
        </div>
        <div class="form-group">
            <label for="valor">Valor (R$)</label>
            <input id="valor" name="valor" type="number" step="0.01" min="0.01" required>
        </div>
        <div class="form-group">
            <label for="data_vencimento">Vencimento</label>
            <input id="data_vencimento" name="data_vencimento" type="date" required>
        </div>
        <div class="form-group">
            <label for="observacao">Observação</label>
            <textarea id="observacao" name="observacao" rows="3"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-secondary"
                    onclick="document.getElementById('modal').innerHTML=''">Cancelar</button>
        </div>
    </form>
</div>
{{end}}
