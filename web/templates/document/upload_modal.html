{{define "document/upload_modal.html"}}
<div id="upload-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal('upload-modal')">
    <div class="modal-card" style="max-width:500px">
        <h2>Novo Documento</h2>
        <form hx-post="/admin/documents"
              hx-encoding="multipart/form-data"
              hx-target="#upload-modal"
              hx-swap="outerHTML">
            {{if .Error}}
            <div class="alert alert-error">{{.Error}}</div>
            {{end}}
            <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" id="name" name="name" placeholder="Nome do documento" value="{{.Name}}" required>
            </div>
            <div class="form-group">
                <label for="file">Arquivo</label>
                <input type="file" id="file" name="file" accept=".pdf,.txt,.docx" required>
                <small class="form-hint">PDF, TXT ou DOCX (max 10MB)</small>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal('upload-modal')">Cancelar</button>
                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Enviar</span>
                    <span class="btn-loading-text">Enviando...</span>
                    <span class="spinner"></span>
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}
