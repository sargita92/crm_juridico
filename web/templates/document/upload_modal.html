{{define "document/upload_modal.html"}}
<div class="modal" id="upload-modal">
    <div class="modal-overlay" onclick="this.parentElement.classList.remove('active')"></div>
    <div class="modal-card" style="max-width:500px">
        <div class="modal-header">
            <h2>Novo Documento</h2>
            <button class="modal-close" onclick="this.closest('.modal').classList.remove('active')">&times;</button>
        </div>
        <form hx-post="/admin/documents"
              hx-encoding="multipart/form-data"
              hx-target="#upload-modal"
              hx-swap="outerHTML">
            <div class="modal-body">
                {{if .Error}}
                <div class="alert alert-error">{{.Error}}</div>
                {{end}}
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" placeholder="Nome do documento" value="{{.Name}}" required>
                </div>
                <div class="form-group">
                    <label for="file">Arquivo</label>
                    <input type="file" id="file" name="file" accept=".pdf,.txt,.docx" required>
                    <small class="form-hint">PDF, TXT ou DOCX (max 10MB)</small>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="this.closest('.modal').classList.remove('active')">Cancelar</button>
                <button type="submit" class="btn btn-primary">
                    <span class="htmx-indicator spinner"></span>
                    Enviar
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}
