{{define "document/list.html"}}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos — CRM Juridico</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
<div class="admin-layout">
    {{template "partials/sidebar.html" (dict "ActiveNav" "documents")}}
    <main class="admin-content">
        <div class="page-header">
            <div>
                <h1>Documentos</h1>
            </div>
            <button class="btn btn-primary" onclick="openModal('upload-modal')">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                Novo Documento
            </button>
        </div>
        {{if .Error}}
        <div class="alert alert-error">{{.Error}}</div>
        {{end}}
        <div class="admin-table-wrapper">
            <div class="filters-bar">
                <input type="search" name="search" placeholder="Buscar por nome..."
                       value="{{.Search}}"
                       hx-get="/admin/documents"
                       hx-trigger="input changed delay:300ms, search"
                       hx-target="#documents-table">
            </div>
            <div id="documents-table">
                {{template "document/table.html" .}}
            </div>
        </div>
    </main>
</div>
{{template "document/upload_modal.html" (dict "Name" "" "Error" "")}}
<script src="/static/js/admin.js"></script>
</body>
</html>
{{end}}
