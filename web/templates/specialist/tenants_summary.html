{{define "specialist/tenants_summary.html"}}
<div style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap">
    <div>
        {{if eq .Count 0}}
        <span class="text-muted">Nenhum escritório associado</span>
        {{else if eq .Count 1}}
        <strong>1 escritório associado</strong>
        {{else}}
        <strong>{{.Count}} escritórios associados</strong>
        {{end}}
        {{if .DefaultName}}
        <div class="text-muted" style="margin-top:0.25rem;font-size:0.875rem">
            Default: <strong>{{.DefaultName}}</strong>
        </div>
        {{end}}
    </div>
    <button class="btn btn-sm btn-primary"
            type="button"
            hx-get="/admin/specialists/{{.SpecialistID}}/tenants/manage"
            hx-target="#tenants-manageable-list"
            hx-swap="innerHTML"
            hx-on::after-request="if(event.detail.successful){openModal('tenants-modal');}">
        Gerenciar Escritórios
    </button>
</div>
{{end}}
