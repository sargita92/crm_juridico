{{define "specialist/tenants_section.html"}}
{{if .Tenants}}
<table class="data-table">
    <thead>
        <tr>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Status</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {{range .Tenants}}
        <tr>
            <td><strong>{{.Name}}</strong></td>
            <td><span class="badge badge-{{if eq .Type "PJ"}}pj{{else}}pf{{end}}">{{.Type}}</span></td>
            <td>
                <span class="badge {{if eq .Status "active"}}badge-active{{else if eq .Status "blocked"}}badge-blocked{{else}}badge-inactive{{end}}">
                    {{if eq .Status "active"}}Ativo{{else if eq .Status "blocked"}}Bloqueado{{else}}Inativo{{end}}
                </span>
            </td>
            <td>
                <button class="btn btn-sm btn-danger"
                        hx-delete="/admin/specialists/{{$.SpecialistID}}/tenants/{{.TenantID}}"
                        hx-target="#tenants-section"
                        hx-swap="innerHTML"
                        hx-confirm="Desassociar este tenant?">
                    Remover
                </button>
            </td>
        </tr>
        {{end}}
    </tbody>
</table>
{{else}}
<div class="empty-state" style="padding:2rem 1rem">
    <p class="text-muted">Nenhum tenant associado</p>
</div>
{{end}}
{{end}}
