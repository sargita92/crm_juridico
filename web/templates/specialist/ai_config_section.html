{{define "specialist/ai_config_section.html"}}
<div id="ai-config-section">
    <h3 class="text-lg font-semibold mb-4">Configuracao de IA</h3>
    {{if .Error}}
    <div class="alert alert-danger">{{.Error}}</div>
    {{end}}
    {{if .Success}}
    <div class="alert alert-success">{{.Success}}</div>
    {{end}}
    <form hx-post="/admin/specialists/{{.SpecialistID}}/ai-config"
          hx-target="#ai-config-section"
          hx-swap="outerHTML">
        <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
                <label class="block text-sm font-medium text-gray-700">Provider</label>
                <select name="provider" class="mt-1 block w-full rounded border-gray-300">
                    <option value="openai" {{if eq .Config.Provider "openai"}}selected{{end}}>OpenAI</option>
                </select>
            </div>
            <div class="form-group">
                <label class="block text-sm font-medium text-gray-700">Modelo</label>
                <input type="text" name="model" value="{{.Config.Model}}"
                       class="mt-1 block w-full rounded border-gray-300"
                       placeholder="gpt-4o-mini">
            </div>
            <div class="form-group">
                <label class="block text-sm font-medium text-gray-700">Temperature</label>
                <input type="number" name="temperature" value="{{.Config.Temperature}}"
                       step="0.1" min="0" max="1"
                       class="mt-1 block w-full rounded border-gray-300">
            </div>
            <div class="form-group">
                <label class="block text-sm font-medium text-gray-700">Max Tokens</label>
                <input type="number" name="max_tokens" value="{{.Config.MaxTokens}}"
                       class="mt-1 block w-full rounded border-gray-300">
            </div>
            <div class="form-group">
                <label class="block text-sm font-medium text-gray-700">Debounce (segundos)</label>
                <input type="number" name="debounce_seconds" value="{{.Config.DebounceSeconds}}"
                       min="0"
                       class="mt-1 block w-full rounded border-gray-300">
            </div>
        </div>
        <button type="submit" class="mt-4 btn btn-primary">Salvar</button>
    </form>
</div>
{{end}}
