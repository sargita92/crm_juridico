{{define "whatsapp/conversations.html"}}
{{if .Error}}
<div class="wa-list-error">
    <p>{{.Error}}</p>
    <button class="btn btn-sm"
            hx-get="/tenant/whatsapp/conversations"
            hx-target="#conversations-list">
        Tentar novamente
    </button>
</div>
{{else if .Conversations}}
<div class="wa-conversations-list">
    {{range .Conversations}}
    {{template "whatsapp/conversation_item.html" .}}
    {{end}}
</div>
{{else}}
<div class="wa-list-empty">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1" width="48" height="48">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
    </svg>
    <p>Nenhuma conversa ainda</p>
    <small>As conversas aparecerao quando alguem enviar uma mensagem pelo WhatsApp</small>
</div>
{{end}}
{{end}}
