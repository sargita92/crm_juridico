{{define "whatsapp/conversation_item.html"}}
<div class="wa-conv-item"
     hx-get="/tenant/whatsapp/conversations/{{.ID}}"
     hx-target="#chat-area"
     hx-push-url="false">
    <div class="wa-conv-avatar">
        {{if .ContactName}}
        <span>{{slice .ContactName 0 1}}</span>
        {{else}}
        <span>?</span>
        {{end}}
    </div>
    <div class="wa-conv-info">
        <div class="wa-conv-top">
            <span class="wa-conv-name">{{if .ContactName}}{{.ContactName}}{{else}}{{.ContactPhone}}{{end}}</span>
            <span class="wa-conv-time">{{.LastMessageAt.Format "15:04"}}</span>
        </div>
        <div class="wa-conv-bottom">
            <span class="wa-conv-preview">{{.LastMessage}}</span>
            {{if gt .UnreadCount 0}}
            <span class="wa-conv-badge">{{.UnreadCount}}</span>
            {{end}}
        </div>
    </div>
</div>
{{end}}
