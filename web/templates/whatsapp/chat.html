{{define "whatsapp/chat.html"}}
{{if .Error}}
<div class="wa-chat-error">
    <p>{{.Error}}</p>
</div>
{{else}}
<div class="wa-chat-container">
    <div class="wa-chat-header">
        <button class="wa-back-btn" onclick="showConversations()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="20" height="20">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
            </svg>
        </button>
        <div class="wa-chat-header-info">
            <h3>Conversa</h3>
        </div>
        <button class="wa-notes-btn" type="button"
                hx-get="/tenant/whatsapp/conversations/{{.ConversationID}}/notes"
                hx-target="#wa-notes-drawer-body"
                hx-swap="innerHTML"
                hx-on:click="document.getElementById('wa-notes-drawer').classList.add('open')">
            📝 Notas
        </button>
    </div>
    <div class="wa-messages" id="messages-area">
        {{if .Messages}}
        {{range .Messages}}
        {{template "whatsapp/message.html" .}}
        {{end}}
        {{else}}
        <div class="wa-messages-empty">
            <p>Inicio da conversa</p>
        </div>
        {{end}}
    </div>
    <div id="messages-poll"
         hx-get="/tenant/whatsapp/conversations/{{.ConversationID}}/messages/new"
         hx-trigger="sse:new-message, every 5s"
         hx-target="#messages-area"
         hx-swap="innerHTML"
         style="display:none"></div>
    <div class="wa-input-area">
        <form hx-post="/tenant/whatsapp/conversations/{{.ConversationID}}/messages"
              hx-target="#messages-area"
              hx-swap="beforeend"
              hx-on::after-request="this.reset(); scrollToBottom();">
            <input type="text" name="content" placeholder="Digite sua mensagem..."
                   autocomplete="off" required>
            <button type="submit" class="wa-send-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="20" height="20">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                </svg>
            </button>
        </form>
    </div>
    <aside id="wa-notes-drawer" class="wa-notes-drawer" aria-label="Notas do cliente">
        <div id="wa-notes-drawer-body"></div>
    </aside>
</div>
{{end}}
{{end}}
