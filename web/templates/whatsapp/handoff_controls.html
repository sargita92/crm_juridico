{{define "whatsapp/handoff_controls.html"}}
<div id="handoff-controls">
    {{if .Error}}
    <div class="alert alert-danger" style="margin-bottom:0.5rem">{{.Error}}</div>
    {{end}}
    <div style="display:flex; align-items:center; gap:0.75rem;">
        {{if .HandoffActive}}
        <span class="badge" style="background:#f59e0b;color:#fff;padding:0.25rem 0.75rem;border-radius:9999px;font-size:0.75rem;font-weight:600;">
            Manual
        </span>
        <button class="btn btn-sm btn-outline"
                hx-post="/tenant/conversations/{{.ConversationID}}/handoff/release"
                hx-target="#handoff-controls"
                hx-swap="outerHTML">
            Devolver para IA
        </button>
        {{else}}
        <span class="badge badge-active" style="padding:0.25rem 0.75rem;border-radius:9999px;font-size:0.75rem;font-weight:600;">
            IA
        </span>
        <button class="btn btn-sm btn-primary"
                hx-post="/tenant/conversations/{{.ConversationID}}/handoff"
                hx-target="#handoff-controls"
                hx-swap="outerHTML">
            Assumir conversa
        </button>
        {{end}}
    </div>
</div>
{{end}}
