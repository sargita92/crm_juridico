run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - misspell
    - goimports

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  govet:
    # shadow nao-habilitado: o codebase usa propositalmente `err :=` em
    # escopos internos, padrao idiomatico Go. Reabilitar requer auditoria
    # caso-a-caso (eventual feature dedicada).
    disable:
      - fieldalignment

issues:
  exclude-dirs:
    - tmp
    - storage
    - fixture
  exclude-rules:
    # Test helpers podem ignorar errcheck para reduzir ruido
    - path: _test\.go
      linters:
        - errcheck
    # Migrations geradas
    - path: migrations/
      linters:
        - errcheck
        - staticcheck
        - unused
  max-issues-per-linter: 0
  max-same-issues: 0
