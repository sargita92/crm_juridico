version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      # shadow nao-habilitado: o codebase usa propositalmente `err :=` em
      # escopos internos, padrao idiomatico Go. Reabilitar requer auditoria
      # caso-a-caso (eventual feature dedicada).
      disable:
        - fieldalignment
    misspell:
      # O codebase é em pt-BR e o misspell usa dicionário inglês, então palavras
      # portuguesas comuns viram falso-positivo. Reescrever a frase toda vez
      # (ver 26b1c60) distorce o texto para agradar o linter; a lista abaixo
      # resolve na origem. Adicionar aqui só palavra pt-BR legítima — se for
      # typo de verdade em inglês, corrigir o código.
      ignore-rules:
        - alternar # flagado como "alternator"
        - eles # flagado como "eels"
    staticcheck:
      # Manter apenas SA* (real bugs) e U* (unused).
      # Desabilitado:
      #   ST* (stylecheck — package comments, naming) — cosmetico
      #   QF* (quick-fix suggestions) — sugestoes, nao bugs
      #   S*  (simplifications) — cosmetico
      checks:
        - SA*
        - U*
  exclusions:
    paths:
      - tmp
      - storage
      - fixture
    rules:
      # Test helpers podem ignorar errcheck para reduzir ruido
      - path: _test\.go
        linters:
          - errcheck
      # Migrations geradas
      - path: migrations/
        linters:
          - errcheck
          - staticcheck
          - unused

formatters:
  enable:
    - goimports
