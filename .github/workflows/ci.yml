name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  promtool:
    name: Validate Prometheus alert rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run promtool test rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "${{ github.workspace }}/infra/prometheus:/etc/prometheus" \
            -w /etc/prometheus \
            prom/prometheus:v2.53.0 \
            test rules alerts_test.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./cmd/... ./internal/...

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./cmd/... ./internal/...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          # v2.12.2 e' a 1a release compilada com Go 1.26 (publicada 2026-05-06).
          # Versoes anteriores falham com `go.mod` apontando para 1.26+ porque
          # o linter precisa ser compilado com >= a versao do alvo.
          version: v2.12.2

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck (com lista de vulns aceitas)
        run: bash scripts/audit-vuln.sh

  test-short:
    name: Tests (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests
        run: go test -short -race -count=1 ./cmd/... ./internal/...

  test-integration:
    name: Tests (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run integration tests (testcontainers)
        run: go test -p 1 -count=1 ./cmd/... ./internal/...

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Coverage thresholds (>=80% por pacote, >=85% global)
        run: bash scripts/audit-cover.sh
